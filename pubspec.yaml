name: face_attendance_app
description: Face recognition attendance tracker (Phase 1 - face recognition only)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.13.2
  tflite_flutter: ^0.12.1
  image: ^4.1.7
  path_provider: ^2.1.3
  uuid: ^4.4.0
  geolocator: ^14.0.3
  supabase_flutter: ^2.15.4
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/mobilefacenet.tflite